name: OBS Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Only one release writes this OBS package at a time. Queued pushes build
# the latest main head and include its commits in the release notes.
concurrency:
  group: ${{ github.repository }}-obs-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
      OBS_API_URL: ${{ vars.OBS_API_URL || 'https://api.opensuse.org' }}
      OBS_PROJECT: ${{ vars.OBS_PROJECT }}
      OBS_PACKAGE: ${{ vars.OBS_PACKAGE || 'vrcs-windows-actions' }}
      OBS_REPOSITORY: ${{ vars.OBS_REPOSITORY || 'windows_x64' }}
      OBS_USERNAME: ${{ secrets.OBS_USERNAME }}
      OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install signing CLI and signature verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y minisign
          npm install --prefix .release/signing-cli --ignore-scripts --no-audit --no-fund @tauri-apps/cli@2.11.4

      - name: Check OBS access and signing key before changing versions
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          python3 scripts/release/obs_release.py preflight
          python3 scripts/release/sign_release.py preflight
          python3 -m unittest discover -s scripts/release -p 'test_*.py' -v

      - name: Reserve the next patch version
        id: version
        run: python3 scripts/release/release.py reserve

      - name: Submit source and wait for both OBS installers
        run: python3 scripts/release/obs_release.py build

      - name: Sign and verify installers; create updater metadata
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python3 scripts/release/sign_release.py release

      - name: Tag and publish release with authors and commits
        run: python3 scripts/release/release.py publish

      - name: Save build logs and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obs-release-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            .release/logs/
            .release/release.json
            .release/obs-revision.json
            .release/notes.md
            release-artifacts/BUILD-INFO-*.txt
            release-artifacts/cuda-*.txt
            release-artifacts/installer-*.nsi
            release-artifacts/tauri-release-*.json
            release-artifacts/release-provenance.json

      - name: Release link
        if: success()
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: printf 'Published [VRCS %s](https://github.com/%s/releases/tag/%s)\n' "$VERSION" "$GITHUB_REPOSITORY" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
